# Pin the Compose project name so the stack keeps using the existing
# paperless_* named volumes (data/media/pgdata/redisdata) that hold the live
# documents and database. Without this, Compose derives the project name from
# the directory ("paperflow") and would create empty paperflow_* volumes.
name: paperless

services:
  broker:
    image: docker.io/library/redis:8
    container_name: paperflow-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
  db:
    image: docker.io/library/postgres:17
    container_name: paperflow-db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD}
  webserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: paperflow-ai:local
    container_name: paperflow
    restart: unless-stopped
    depends_on:
      - db
      - broker
    ports:
      - "8010:8000"
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_URL: ${PAPERLESS_URL:-http://localhost:8010}
      # Extra origins trusted for CSRF/login beyond PAPERLESS_URL (e.g. a
      # subdomain wildcard). Comma-separated, scheme included.
      PAPERLESS_CSRF_TRUSTED_ORIGINS: ${PAPERLESS_CSRF_TRUSTED_ORIGINS:-}
      # Build absolute URLs from the reverse proxy's forwarded host/scheme so
      # the app follows whatever hostname the request arrived on.
      PAPERLESS_USE_X_FORWARD_HOST: ${PAPERLESS_USE_X_FORWARD_HOST:-}
      PAPERLESS_USE_X_FORWARD_PORT: ${PAPERLESS_USE_X_FORWARD_PORT:-}
      PAPERLESS_PROXY_SSL_HEADER: ${PAPERLESS_PROXY_SSL_HEADER:-}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_TIME_ZONE: ${PAPERLESS_TIME_ZONE:-UTC}
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE:-eng}
      # Mistral OCR parser (falls back to Tesseract when no key is set)
      PAPERLESS_MISTRAL_API_KEY: ${PAPERLESS_MISTRAL_API_KEY:-}
      PAPERLESS_MISTRAL_MODEL: ${PAPERLESS_MISTRAL_MODEL:-mistral-ocr-latest}
      # AI suite (llama-index): embeddings index + agentic chat.
      # Set PAPERLESS_AI_LLM_API_KEY to your Mistral key to enable.
      PAPERLESS_AI_ENABLED: ${PAPERLESS_AI_ENABLED:-true}
      PAPERLESS_AI_LLM_EMBEDDING_BACKEND: ${PAPERLESS_AI_LLM_EMBEDDING_BACKEND:-mistral}
      PAPERLESS_AI_LLM_EMBEDDING_MODEL: ${PAPERLESS_AI_LLM_EMBEDDING_MODEL:-mistral-embed}
      PAPERLESS_AI_LLM_BACKEND: ${PAPERLESS_AI_LLM_BACKEND:-mistral}
      PAPERLESS_AI_LLM_MODEL: ${PAPERLESS_AI_LLM_MODEL:-mistral-large-latest}
      PAPERLESS_AI_LLM_API_KEY: ${PAPERLESS_AI_LLM_API_KEY:-${PAPERLESS_MISTRAL_API_KEY:-}}
      USERMAP_UID: ${USERMAP_UID:-1000}
      USERMAP_GID: ${USERMAP_GID:-1000}
  webdav:
    # WebDAV drop-box mapped onto the consume folder: files uploaded here are
    # picked up by the Paperless consumer. Reachable on host port 8080.
    build:
      context: ./docker/webdav
    image: paperflow-webdav
    container_name: paperflow-webdav
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./consume:/dav
    environment:
      WEBDAV_USER: ${WEBDAV_USER}
      WEBDAV_PASSWORD: ${WEBDAV_PASSWORD}
volumes:
  data:
  media:
  pgdata:
  redisdata:
