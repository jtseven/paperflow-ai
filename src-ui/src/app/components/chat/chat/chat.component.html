<li ngbDropdown [autoClose]="'outside'" class="nav-item">
  <button
    class="btn navbar-action border-0"
    id="chatDropdown"
    ngbDropdownToggle
    aria-label="Chat"
    i18n-aria-label
  >
    <lucide-icon
      width="1.3em"
      height="1.3em"
      name="chat-left-text"
    ></lucide-icon>
  </button>
  <div
    ngbDropdownMenu
    class="dropdown-menu-end shadow p-0"
    aria-labelledby="chatDropdown"
  >
    <pngx-chat-panel
      [documentId]="documentId"
      [placeholder]="placeholder"
    ></pngx-chat-panel>
  </div>
</li>
