<li ngbDropdown [autoClose]="'outside'" class="nav-item me-n2">
  <button class="btn border-0" id="chatDropdown" ngbDropdownToggle>
    <lucide-icon
      width="1.3em"
      height="1.3em"
      name="chat-left-text"
    ></lucide-icon>
  </button>
  <div
    ngbDropdownMenu
    class="dropdown-menu-end shadow p-3"
    aria-labelledby="chatDropdown"
  >
    <pngx-chat-panel
      [documentId]="documentId"
      [placeholder]="placeholder"
    ></pngx-chat-panel>
  </div>
</li>
