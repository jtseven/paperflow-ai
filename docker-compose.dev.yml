# Development override, bring up the dev stack with:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# (Tip: export COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml to make a
# plain `docker compose up` use dev in your shell.)
#
# Entry point: http://localhost:4200  (Angular dev server + proxy to Django)
#   - Frontend HMR: changes to src-ui/ are reflected instantly
#   - /api, /accounts, /static, /ws proxied to Django on :8000
#   - Login/signup flow works end-to-end through the proxy
#
# Backend Python changes are picked up automatically via --reload.
# To wipe the frontend node_modules cache: docker volume rm paperless_frontend_nm

services:
  broker:
    # Disable RDB persistence in dev — the redisdata volume may have wrong
    # ownership from a previous install, causing stop-writes-on-bgsave-error
    # which blocks all Celery task writes and breaks document processing.
    command: redis-server --save "" --appendonly no

  webserver:
    ports:
      - "8000:8000"
    volumes:
      - ./src:/usr/src/paperless/src
    environment:
      PAPERLESS_DEBUG: "yes"
      PAPERLESS_DISABLE_WHITENOISE: "1"
      GRANIAN_RELOAD: "true"

  frontend:
    image: docker.io/node:24-trixie-slim
    working_dir: /app
    command: ["sh", "-c", "corepack enable && pnpm install && ./node_modules/.bin/ng serve --host 0.0.0.0 --port 4200 --disable-host-check --proxy-config proxy.conf.js"]
    environment:
      BACKEND_HOST: webserver   # Docker service name; override with localhost for local ng serve
    ports:
      - "4200:4200"
    volumes:
      - ./src-ui:/app
      - frontend_nm:/app/node_modules

volumes:
  frontend_nm:
